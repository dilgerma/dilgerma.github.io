# Site settings
title: Nebulit
description: Event Modeling - learn, design and build event-driven systems with the EM-Studio. Tutorials, workshops, blog, podcast and AI code generation from your event models.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://eventmodelers.ai" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
theme: minima
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  docs:
    output: true
    permalink: /docs/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "docs"
  - scope:
      path: "docs/blog.md"
    values:
      hide_nav: true
  - scope:
      path: "docs/blog"
    values:
      hide_nav: true
  - scope:
      path: "docs/podcast.md"
    values:
      hide_nav: true
  - scope:
      path: "docs/podcast"
    values:
      hide_nav: true
  - scope:
      path: "docs/basic-modeling-topics/videos.md"
    values:
      hide_nav: true
  - scope:
      path: "docs/event-modeling.md"
    values:
      hide_nav: true
  - scope:
      path: ""
    values:
      layout: "default"
